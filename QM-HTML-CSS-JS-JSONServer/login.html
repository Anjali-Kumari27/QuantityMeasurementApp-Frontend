<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="main-container">

    <!-- Left Panel -->
    <div class="left-panel">
      <div class="image-circle">
        <img src="images/measurement.png" alt="Measurement Logo" />
      </div>
      <h2>QUANTITY<br>MEASUREMENT APP</h2>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="tabs">
        <a href="login.html" class="tab active">LOGIN</a>
        <a href="signup.html" class="tab">SIGNUP</a>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email Id</label>
        <input type="email" id="loginEmail" placeholder="" />

        <label for="loginPassword">Password</label>
        <div class="password-box">
          <input type="password" id="loginPassword" placeholder="" />
          <span class="eye" onclick="togglePassword('loginPassword')">👁</span>
        </div>

        <button type="submit">Login</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
