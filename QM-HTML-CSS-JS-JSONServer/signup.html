<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement - Signup</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="main-container">

    <!-- Left Panel -->
    <div class="left-panel">
      <div class="image-circle">
        <img src="images/measurement.png" alt="Measurement Logo" />
      </div>
      <h2>QUANTITY<br>MEASUREMENT APP</h2>
    </div>

    <!-- Right Panel -->
    <div class="right-panel signup-panel">
      <div class="tabs">
        <a href="login.html" class="tab">LOGIN</a>
        <a href="signup.html" class="tab active">SIGNUP</a>
      </div>

      <form id="signupForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" />

        <label for="email">Email Id</label>
        <input type="email" id="email" />

        <label for="password">Password</label>
        <div class="password-box">
          <input type="password" id="password" />
          <span class="eye" onclick="togglePassword('password')">👁</span>
        </div>

        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" />

        <button type="submit">Signup</button>
        <p id="signupMessage" class="message"></p>
      </form>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
